name: 뉴스 키워드 알림

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정에 따라 수 분 지연될 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write             # seen_links.txt 저장(커밋)용

concurrency:
  group: news-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests

      - name: 뉴스 확인·알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_alert.py

      - name: 알림 기록 저장
        run: |
          git config user.name "news-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add seen_links.txt
          git diff --cached --quiet || git commit -m "알림 기록 갱신"
          git push
