name: DART 공시 알림 (금융사)

on:
  schedule:
    - cron: "3-59/10 * * * *"  # 10분마다, 3분 오프셋 (다른 알림과 커밋 충돌 방지)
  workflow_dispatch:            # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write               # seen_dart.txt 저장(커밋)용

concurrency:
  group: dart-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests

      - name: 공시 확인·알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_TELEGRAM_BOT_TOKEN: ${{ secrets.DART_TELEGRAM_BOT_TOKEN }}
          DART_TELEGRAM_CHAT_ID: ${{ secrets.DART_TELEGRAM_CHAT_ID }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python dart_alert.py

      - name: 알림 기록 저장
        run: |
          git config user.name "dart-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add seen_dart.txt
          git diff --cached --quiet || git commit -m "공시 알림 기록 갱신"
          git push
